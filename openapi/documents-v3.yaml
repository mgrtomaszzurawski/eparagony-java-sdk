  responses:
    TokenResponse200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
              - scope
              - token_type
              - expires_in
            properties:
              access_token:
                type: string
                description: ''
                example: MTQ0NjJkZmQ5OTM2NDE1ZTZjNGZmZjI3
              scope:
                type: string
                description: ''
                example: document_create
              token_type:
                type: string
                description: token type - bearer by default
                example: bearer
              expires_in:
                type: integer
                description: Token validity time - 1 hour by default
                example: 3600
    Error-502_503_504:
      description: >-
        Retry request for any of [Bad Gateway, Service Unavailable, Gateway
        Timeout].
    CreateDocument-200:
      description: >
        **Document created**

        <br/>

        Code 200 is returned when no document was ordered to be fiscalized via
        eparagony.pl
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateDocumentSuccess'
    CreateDocument-202:
      description: >
        **Document data accepted**

        <br/>

        <p style="margin: -1em 0 0 3.5em;">The document data has been accepted
        with the fiscalization order (with the flag `fiscalize: true`) - the
        release of the e-fiscal document via the fiscal device will be launched
        soon</p>
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateDocumentSuccess'
    CreateDocument-400:
      description: |
        **Bad Request**
        <br/>
        Validation error or business error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonError400Schema'
              - type: object
                properties:
                  errorCode:
                    type: number
                    example: 41
                    description: |
                      The error code can take the following values:
                      <ul>
                        <li> 41 – GENERAL_VALIDATION_ERROR (then the <span class="eqivia">message</span> parameter contains detailed information about the validation error) </li>
                        <li> 43 – INVALID_POS_ID </li>
                        <li> 87 - DECLARED_PAYMENT_NOT_EQUAL_SALES_VALUE - the sum of all discounts and line values is not equal to the transferred payment amount</li>
                        <li> 99 – INVOICE_NUMBER_REQUIRED - the <span class="eqivia">eInvoice.metadata.invoiceNumber</span> field must be specified or there is no configuration setting to generate the invoice number if it is not sent. The error only occurs if the invoice is sent</li>
                        <li> 111 - IDEMPOTENCY_KEY_NOT_PROVIDED - missing `Idempotency-Key` header</li>
                        <li> 118 - DOCUMENT_ALREADY_EXISTS - document with the specified token already exists</li>
                        <li> 120 - INVALID_API_VERSION - incorrect API version or missing header `X-Api-Version`</li>
                        <li> 137 - KSEF_DISABLED - <span class="eqivia">"eInvoicingHub": "KSEF"</span> was provided, but the KSeF integration has not been enabled</li>
                      </ul>
    NotAuthorized-401:
      description: >-
        Not authorized (sprawdź `client_id`, `client_secret` lub ważność
        `access_token`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401Schema'
    Forbidden-403:
      description: >
        **Forbidden**

        <br />

        Confirm correct credentials and/or identifiers (like `posId`) were
        provided and the `access_token` has been obtained using `scope` relevant
        for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403Schema'
    CreateDocument-422:
      description: >
        **Idempotency key error**

        <br/>

        Missing `Idempotency-Key` header or the same value was sent in the
        `Idempotency-Key` header again but with different data than in the first
        request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error422Schema'
    getDocumentJWSResponse-200:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentJWSPayload'
    getDocumentJWSResponse-400:
      description: Bad request – business error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentJWSError-400'
    PrinterStatusResponse200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                description: >-
                  Status `ACTIVE` means that printer was active over last 15
                  minutes. The `lastActiveAt` parameter can be used to define
                  own meaning of the fiscal device activeness (e.g. last 10
                  minutes, 1 hour).
                enum:
                  - ACTIVE
                  - INACTIVE
              lastActiveAt:
                type: string
                nullable: true
                description: >-
                  Time of last successful confirmation of active connection to
                  the fiscal device. If connection was never established `null`
                  is returned.
                example: '2019-09-02T23:59:59.999Z'
              crkStatus:
                type: object
                properties:
                  lastConnectedAt:
                    type: string
                    nullable: true
                    description: >-
                      Time of last successful connection of the fiscal device to
                      the repository (specifically: EventHub intended for
                      receiving packages of fiscal documents by the Central
                      Repository of Cash Registers of the Ministry of Finance).
                      In the absence of information about last connection to the
                      repository, `null` value is returned.
                    example: '2019-09-02T23:59:59.999Z'
                required:
                  - lastConnectedAt
            required:
              - status
              - lastActiveAt
              - crkStatus
    DailyReportsResponse200:
      description: List of the daily fiscal reports
      content:
        application/json:
          schema:
            type: object
            required:
              - reports
            properties:
              reports:
                type: array
                description: Daily fiscal report
                items:
                  type: object
                  required:
                    - issuedAt
                    - reportNumber
                    - taxRates
                    - invoices
                    - saleGross
                    - sale
                    - tax
                    - saleTotal
                    - taxTotal
                    - emergencySituationsCount
                    - canceledReceiptsCount
                    - nonFiscalDocumentsCount
                    - receiptsCount
                    - programmingEventsCount
                    - dbChangesCount
                    - nonFiscalErrorsCount
                    - communicationErrorsCount
                  properties:
                    issuedAt:
                      type: string
                      description: Report issuance date
                      example: '2024-04-17T20:00:00.000Z'
                    saleFrom:
                      type: string
                      description: Start date of sales covered by the report
                      example: '2024-04-17T00:00:00.000Z'
                    saleTo:
                      type: string
                      description: End date of sales covered by the report
                      example: '2024-04-17T19:00:00.000Z'
                    reportNumber:
                      type: integer
                      format: int32
                      description: Report number
                      example: 12273
                    taxRates:
                      type: object
                      description: Current values of tax rates with letter codes
                      properties:
                        A:
                          type: number
                          example: 23
                          description: Tax rate, code A, as percentage
                        B:
                          type: number
                          example: 8
                          description: Tax rate, code B, as percentage
                        C:
                          type: number
                          example: 5
                          description: Tax rate, code C, as percentage
                        D:
                          type: number
                          example: 0
                          description: Tax rate, code D, as percentage
                        E:
                          type:
                            - string
                            - number
                          example: 100
                          description: >-
                            Tax rate `ZW`, code E. The returned value may vary
                            depending on the printer manufacturer and may be
                            either a number, e.g. 100, or a single character,
                            e.g. "="
                        F:
                          type:
                            - string
                            - number
                          example: 0
                          description: >-
                            Tax rate, code F, as percentage. In the case of an
                            inactive rate, the returned value may vary depending
                            on the printer manufacturer and may be either a
                            number, e.g. 101, or a single character, e.g. "?"
                        G:
                          type:
                            - string
                            - number
                          example: 0
                          description: >-
                            Tax rate, code G, as percentage. In the case of an
                            inactive rate, the returned value may vary depending
                            on the printer manufacturer and may be either a
                            number, e.g. 101, or a single character, e.g. "?"
                    invoices:
                      $ref: '#/components/schemas/AmountPerTaxRate'
                    saleGross:
                      $ref: '#/components/schemas/AmountPerTaxRate'
                    sale:
                      $ref: '#/components/schemas/AmountPerTaxRate'
                    tax:
                      $ref: '#/components/schemas/AmountPerTaxRate'
                    saleTotal:
                      description: Total sale
                      type: string
                    taxTotal:
                      description: Total taxes
                      type: string
                    emergencySituationsCount:
                      description: Emergency situations count
                      type: integer
                      format: int32
                    canceledReceiptsCount:
                      description: Canceled receipts count
                      type: integer
                      format: int32
                    nonFiscalDocumentsCount:
                      description: Non fiscal documents count
                      type: integer
                      format: int32
                    receiptsCount:
                      description: Receipts count
                      type: integer
                      format: int32
                    programmingEventsCount:
                      type: object
                      required:
                        - useOrService
                        - online
                      properties:
                        userOrService:
                          description: >-
                            Number of programming events caused by the user or
                            service
                          type: integer
                          format: int32
                        online:
                          description: >-
                            Number of programming events caused by communication
                            protocol
                          type: integer
                          format: int32
                    dbChangesCount:
                      description: Database chagnes count
                      type: integer
                      format: int32
                    nonFiscalErrorsCount:
                      description: Non fiscal errors count
                      type: integer
                      format: int32
                    communicationErrorsCount:
                      description: Communication erros count
                      type: integer
                      format: int32
