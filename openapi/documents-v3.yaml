            - advancePaymentInvoices
            - lines
    CreateSettlementInvoiceDocumentPayload:
      title: Settlement invoice (PDSettlementInvoice)
      allOf:
        - $ref: '#/components/schemas/CreateDocumentPayload'
        - type: object
          required:
            - transactionToken
            - eInvoice
          properties:
            transactionToken:
              type: string
              format: UUIDv4
              example: 79ab86bd-ff41-485d-832f-4b987d217da0
              description: >
                Unique transaction identifier in UUIDv4 format. **The
                transactionToken value must be the same as in previously sent
                advance payment invoices for a given order** – i.e., a value
                generated by the client or obtained for the first of the advance
                payment invoices for this order. This is important, among other
                things, so that all advance payment invoices and the final
                invoice can be presented to the buyer under one link.
            statusUrl:
              type: string
              description: >
                If `eInvoicingHub: 'KSEF'` was also sent in the `eInvoice`
                object, notifications about the progress of the invoice issuance
                process in KSeF along with the KSeF number, or error
                information, will be sent to the provided address.
            eInvoice:
              $ref: '#/components/schemas/PDSettlementInvoice'
    CorrectiveInvoiceMetadata:
      allOf:
        - type: object
          properties:
            correctionReason:
              type: string
              description: Correction reason
            invoiceDate:
              type: string
              description: >-
                Invoice issue date. If no value is sent, the current date is
                used.
              example: '2025-12-01'
            orderId:
              type: string
              description: >-
                Order ID (if the document can be linked to a customer order).
                Uniqueness is not required on the eparagony.pl side.
              example: ORD-2025-001234
            additionalDescription:
              type: array
              description: >
                Advertising and informational content defined by the seller. May
                contain information not covered earlier - system numbers, codes
                and identifiers of transactions and orders in reference to which
                the transaction is carried out, which may be included in the
                document, information about the serving employee. Each line
                contains a separate object - graphical or textual.


                If the request concerns an invoice issued in KSeF, only lines of
                the following types will be passed:

                - TEXT

                - KEY_VALUE
              items:
                $ref: '#/components/schemas/AdditionalDescriptionLine'
        - $ref: '#/components/schemas/InvoiceNumber'
        - $ref: '#/components/schemas/CommonMetadata'
    StaticInvoiceNumber:
      type: object
      properties:
        invoiceNumber:
          type: string
          description: Invoice number.
          example: 2022/07/122
    CommonCorrectedInvoiceMetadata:
      type: object
      properties:
        currency:
          type: string
          description: >-
            Invoice currency designation (three-letter code compliant with
            ISO-4217)
          pattern: ^([A-Z]{3})$
          example: EUR
        merchantName:
          type: string
          description: Seller's (taxpayer's) first and last name or company name
          example: Platforma Detalistów sp z o.o.
        merchantAddress:
          $ref: '#/components/schemas/EntityAddress'
        consumerName:
          type: string
          description: Buyer's first and last name or company name
          example: Platforma Detalistów sp z o.o.
        consumerAddress:
          $ref: '#/components/schemas/EntityAddress'
        invoiceNumber:
          type: string
          description: Invoice number
          example: FA/2025/1
    PDCorrectiveInvoice:
      title: PDCorrectiveInvoice
      description: >-
        Object containing all data necessary to issue a corrective invoice in
        electronic form in the National e-Invoice System (KSeF). Note: this
        parameter can be passed provided that the same request does not include
        parameters `eTicketReceipt`, `eReceipt`, `eInvoice` or `eGeneric`.
      discriminator:
        propertyName: invoiceType
        mapping:
          VAT Invoice: '#/components/schemas/PDVatCorrectiveInvoice'
          Advance payment invoice: '#/components/schemas/PDAdvancePaymentCorrectiveInvoice'
          Settlement invoice: '#/components/schemas/PDSettlementCorrectiveInvoice'
      type: object
      properties:
        invoiceType:
          type: string
          enum:
            - VAT
            - ADVANCE_PAYMENT
            - SETTLEMENT
          description: >
            Type of invoice being corrected. Available corrected invoice types:


            | value | description |

            |---------|------|

            | VAT | Standard invoice |

            | ADVANCE_PAYMENT | Advance payment invoice, documenting payment
            received before product delivery/service completion |

            | SETTLEMENT | Settlement invoice, enabling settlement of previously
            received advance payments |
        eInvoicingHub:
          type: string
          description: Allows requesting corrective invoice issuance in the KSeF system.
          enum:
            - KSEF
      required:
        - invoiceType
    PDVatCorrectiveInvoice:
      title: Corrective invoice for VAT invoice
      allOf:
        - type: object
          properties:
            invoiceType:
              type: string
              const: VAT
            metadata:
              $ref: '#/components/schemas/CorrectiveInvoiceMetadata'
            correctedMetadata:
              allOf:
                - type: object
                  properties:
                    invoiceDate:
                      type: string
                      description: Invoice issue date
                      example: '2025-12-01'
                    eInvoiceHubNumber:
                      type: string
                      description: >-
                        KSeF number of the corrected invoice if the invoice was
                        issued in KSeF
                    vatCalculationMethod:
                      type: string
                      description: >
                        Declared method for calculating the VAT summary on the
                        document (`taxValueByTaxRate`, `netValueByTaxRate`).
                        Must be provided when the `correctedLines` field is
                        sent. It affects which fields are required in line
                        items:

                        - `SUM_OF_LINES_NET` or `SUM_OF_RATES_NET` — required in
                        lines: net price, quantity, net amount, VAT rate, VAT
                        amount.

                        - `SUM_OF_LINES_GROSS` or `SUM_OF_RATES_GROSS` —
                        required in lines: gross price, quantity, gross amount,
                        VAT rate, VAT amount.
                      enum:
                        - SUM_OF_LINES_NET
                        - SUM_OF_RATES_NET
                        - SUM_OF_LINES_GROSS
                        - SUM_OF_RATES_GROSS
                      example: SUM_OF_LINES_NET
                    calculationValidation:
                      type: string
                      description: >
                        Calculation validation configuration. Must be provided
                        when the `correctedLines` field is sent. At the current
                        stage of API development, no calculations within the
                        document are validated – this field will allow adding
                        the possibility of default validation in the future,
                        without affecting existing implementations.
                      enum:
                        - NONE
                      example: NONE
                  required:
                    - grossSaleValue
                    - invoiceDate
                    - invoiceNumber
                - $ref: '#/components/schemas/VatInvoiceMetadata'
                - $ref: '#/components/schemas/StaticInvoiceNumber'
                - $ref: '#/components/schemas/CurrencyAndExchangeRateMetadata'
                - $ref: '#/components/schemas/CommonCorrectedInvoiceMetadata'
              description: Invoice metadata before correction
            correctingMetadata:
              allOf:
                - type: object
                  properties:
                    merchantTIN:
                      type: string
                      title: NIP PL
                      description: Seller's (taxpayer's) tax identification number
                      example: '5213796333'
                      pattern: >-
                        ^([1-9](([0-9][1-9])|([1-9][0-9]))[0-9][0-9][0-9][0-9][0-9][0-9][0-9])$
                    consumerTIN:
                      type: string
                      minLength: 1
                      maxLength: 50
                      description: >-
                        Tax identification number. Field validation is linked to
                        the value of the `consumerAddress.country` field. If
                        `PL` is entered in the `consumerAddress.country` field,
                        the checksum of the tax identification number is
                        verified. Field is optional; if not provided, the
                        invoice is treated as B2C (the `BrakID` element with
                        value `1` is passed in KSeF).
                      example: '5213796333'
                    vatCalculationMethod:
                      type: string
                      description: >
                        Declared method for calculating the VAT summary on the
                        document (`taxValueByTaxRate`, `netValueByTaxRate`).
                        Must be provided when the `correctingLines` field is
                        sent. It affects which fields are required in line
                        items:

                        - `SUM_OF_LINES_NET` or `SUM_OF_RATES_NET` — required in
                        lines: net price, quantity, net amount, VAT rate, VAT
                        amount.

                        - `SUM_OF_LINES_GROSS` or `SUM_OF_RATES_GROSS` —
                        required in lines: gross price, quantity, gross amount,
                        VAT rate, VAT amount.
                      enum:
                        - SUM_OF_LINES_NET
                        - SUM_OF_RATES_NET
                        - SUM_OF_LINES_GROSS
                        - SUM_OF_RATES_GROSS
                      example: SUM_OF_LINES_NET
                    calculationValidation:
                      type: string
                      description: >
                        Calculation validation configuration. Must be provided
                        when the `correctingLines` field is sent. At the current
                        stage of API development, no calculations within the
                        document are validated – this field will allow adding
                        the possibility of default validation in the future,
                        without affecting existing implementations.
                      enum:
                        - NONE
                      example: NONE
                    vatExemptionSource:
                      type: string
                      enum:
                        - POLISH_LAW
                        - EU_DIRECTIVE
                        - OTHER
                      description: >
                        Source of the legal basis for exemption in the case of
                        supply of goods or provision of services exempt from
                        tax:

                        - POLISH_LAW - tax exemption based on Polish law

                        - EU_DIRECTIVE - tax exemption based on Council
                        Directive 2006/112/WE

                        - OTHER - other source of tax exemption


                        No value means there is no supply of goods or provision
                        of services exempt from tax.
                    vatExemptionReason:
                      type: string
                      description: >-
                        Provision under which the taxpayer applies the tax
                        exemption. Required if `vatExemptionSource` is provided.
                    isInvoiceForReceipt:
                      type: boolean
                      description: Flag indicating that this is an invoice for a receipt
                    isReverseChargeProcedure:
                      type: boolean
                      description: >-
                        Flag indicating that the invoice relates to sales under
                        the reverse charge procedure
                    isCashAccountingScheme:
                      type: boolean
                      description: >-
                        Flag indicating that the invoice relates to sales
                        settled using the cash accounting scheme
                    isSplitPayment:
                      type: boolean
                      description: >-
                        Flag indicating that the invoice should be paid using
                        the split payment mechanism
                  required:
                    - merchantTIN
                    - merchantName
                    - merchantAddress
                    - consumerName
                    - consumerAddress
                    - grossSaleValue
                - $ref: '#/components/schemas/VatInvoiceMetadata'
                - $ref: '#/components/schemas/StaticInvoiceNumber'
                - $ref: '#/components/schemas/CurrencyAndExchangeRateMetadata'
                - $ref: '#/components/schemas/CommonCorrectedInvoiceMetadata'
              description: >-
                Invoice metadata after correction. The same set of corrected
                data as in the `correctedMetadata` field should be provided.
            correctedLines:
              type: array
              description: Invoice items before correction
              items:
                $ref: '#/components/schemas/InvoiceLineWithRebates'
              minimum: 1
            correctingLines:
              type: array
              description: >-
                Invoice items after correction. The number of invoice items
                after correction must equal the number of items before
                correction.
              items:
                $ref: '#/components/schemas/InvoiceLineWithRebates'
              minimum: 1
            extensions:
              $ref: '#/components/schemas/EInvoiceExtension'
            payment:
              $ref: '#/components/schemas/InvoicePayment'
            correctedAdditionalParties:
              type: array
              items:
                $ref: '#/components/schemas/AdditionalParty'
              maxItems: 100
              description: >
                Optional list of additional parties from the ORIGINAL invoice
                being corrected. Use this field to specify which additional
                parties were listed on the invoice that is being corrected.
            correctingAdditionalParties:
              type: array
              items:
                $ref: '#/components/schemas/AdditionalParty'
              maxItems: 100
              description: >
                Optional list of additional parties for the CORRECTING invoice.
                Use this field to specify the corrected/updated list of
                additional parties that should replace those on the original
                invoice.
          required:
            - invoiceType
            - metadata
            - correctedMetadata
            - correctingMetadata
        - $ref: '#/components/schemas/PDCorrectiveInvoice'
