openapi: 3.0.0
info:
  title: 'eparagony.pl: Documents REST API'
  x-logo:
    url: https://docs.eparagony.pl/public/images/pd_logo_eparagony.png
    backgroundColor: '#4527A0'
    altText: Logo Platforma Detalistów
  contact: {}
  version: 'X-Api-Version: 3 (20260311)'
  description: >

    ## Introduction


    <div style="background-color: #f9f9f9; border-radius: 5px; border-left: 6px
    solid #4527A0; padding: 30px; margin: 20px 0; font-size: 16px;">
      The following document describes the methods available in the eparagony.pl API.
      <br /><br />

      To understand how the various methods are called, see [introduction to the API](/en/docs/integracje/API).
    </div>
servers:
  - url: https://sandbox.eparagony.pl
  - url: https://api.eparagony.pl
    variables: {}
paths:
  /auth/token:
    post:
      summary: Obtaining and refreshing an access token
      servers:
        - url: https://login.eparagony.pl
        - url: https://login.sandbox.eparagony.pl
      tags:
        - Authorization
      description: >

        Obtaining the `access_token` - in the server-server (OAuth
        client_credentials) communication process


        There is no separate token refresh process. Refreshing is done by
        generating a new token.


        Before performing any operation that requires providing the
        `access_token` as an authorization method, you should check if it has
        expired (`expires_in`). If the token has expired, the operation will be
        rejected by the system,

        If the `expires_in` parameter indicates that the token is active, the
        operation can be performed without additional authorization steps,

        If the attempt resulted in a `401` error or the token has expired, you
        should obtain new `access_token`.


        The implementation should store the `access_token` until expiry (1 hour
        by default). It is discouraged to to retrieve a new `access_token`
        before each API request.


        The `access_token` obtained from this process should be provided in the
        `Authorization` header with the value `Bearer`.


        ```
          Authorization: Bearer <access_token>
        ```


        Caution. The number of possible requests is limited for a single IP.
        Sending too many requests will cause error 429.
      operationId: GetTokens
      parameters:
        - $ref: '#/components/parameters/Content-Type-form'
        - $ref: '#/components/parameters/apiVersion3'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/X-Integration-Id'
      requestBody:
        $ref: '#/components/requestBodies/AuthToken'
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse200'
        '400':
          description: Request body is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '404':
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        5XX:
          $ref: '#/components/responses/Error-502_503_504'
    AuthToken: &ref_7
      description: >-
        **Note:** Request body should be send as a form –
        `application/x-www-form-urlencoded`
      content:
        application/x-www-form-urlencoded:
          schema:
            discriminator:
              propertyName: grant_type
              mapping:
                client_credentials: '#/components/schemas/AuthTokenPayload'
            oneOf:
              - $ref: '#/components/schemas/AuthTokenPayload'
          examples:
            client_credentials:
              value: >-
                grant_type=client_credentials&client_secret=sNi4QXthdx2OdZYIJSla7HaoGDER0maY&scope=ecommerce&client_id=sNi4QXthdx2OdZYIJSla7HaoGDER0maY
      required: true
  /documents:
    post:
      tags:
        - Issuing e-Document
      summary: Requesting the issuance of a document
      security:
        - oauth-cc:
            - document_create
      description: >

        **Note:**


        1. The service is used to perform two basic tasks:
            1. enables the generation of a fiscal document (receipt or invoice) based on the sent data. This is possible using the Eparagony Document Print Service module, which, installed within the partner's infrastructure, acts as a communication bridge between the eparagony.pl System and the partner's fiscal printer. In the case of such an integration model, the `fiscalize: true` flag and optionally `statusUrl` should be passed to receive a webhook notification of the success or failure of fiscalization.
            2. enables the issuance of an invoice in the KSeF system based on the sent data. This is possible after correctly configuring permissions on the KSeF system side. More information in the [KSeF system integration documentation](/en/docs/integracje/KSeF/).
        2. In addition, endpoint can be used to:
            - sending additional information not provided for in the standard e-paragon, the schema of which is limited
            - optional issuance of a digital confirmation of the transaction, containing a range of data similar to an e-paragon, which, however, does not replace the fiscal document in paper or electronic form
        3. The processing status of an issued document can be tracked using the
        [Download Document Status](#operation/GetDocumentStatus) service.
      operationId: CreateDocument
      parameters:
        - $ref: '#/components/parameters/Content-Type-json'
        - $ref: '#/components/parameters/apiVersion3'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/XCurrentTimePOS'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/X-Integration-Id'
      requestBody:
        $ref: '#/components/requestBodies/createDocument'
      responses:
        '200':
          $ref: '#/components/responses/CreateDocument-200'
        '202':
          $ref: '#/components/responses/CreateDocument-202'
        '400':
          $ref: '#/components/responses/CreateDocument-400'
        '401':
          $ref: '#/components/responses/NotAuthorized-401'
        '403':
          $ref: '#/components/responses/Forbidden-403'
        '422':
          $ref: '#/components/responses/CreateDocument-422'
        5XX:
          $ref: '#/components/responses/Error-502_503_504'
  /documents/{documentToken}/status:
    get:
      summary: Get document status
      tags:
        - Issuing e-Document
      description: >
        Used when:

        1. store have not received webhook (e.g. when webhook retries are no
        longer performed by eparagony.pl)

        2. or when there is a need to check the fiscalization status between
        webhook retries (e.g. to speed up the process after 10-20 seconds of
        waiting)

        3. or when you are integrating with eparagony.pl without using webhooks)


        **Important:**

        Please use the webhook first.

        When using this endpoint, it is a good practice to implement an
        exponential delay in the frequency of status queries.
      security:
        - oauth-cc:
            - document_create
            - ecommerce
      operationId: GetDocumentStatus
      parameters:
        - $ref: '#/components/parameters/documentToken'
        - $ref: '#/components/parameters/apiVersion3'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/X-Integration-Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - title: Receipt
                    discriminator:
                      propertyName: status
                      mapping:
                        CONFIRMED: >-
                          #/components/schemas/CommonFiscalDocumentStatusConfirmed
                        READY: '#/components/schemas/CommonFiscalDocumentStatusReady'
                        PENDING: >-
                          #/components/schemas/FiscalDocumentStatusPendingResponsePayload
                        ERROR: '#/components/schemas/FiscalDocumentStatusErrorPayload'
                  - title: Invoice
                    discriminator:
                      propertyName: status
                      mapping:
                        CONFIRMED: '#/components/schemas/CommonInvoiceStatusConfirmed'
                        OFFLINE: '#/components/schemas/CommonInvoiceStatusOffline'
                        PENDING: >-
                          #/components/schemas/InvoiceStatusPendingResponsePayload
                        ERROR: '#/components/schemas/KsefDocumentStatusErrorPayload'
                  - title: Other
                    $ref: '#/components/schemas/DocumentStatusReceivedResponsePayload'
              examples:
                CONFIRMED (receipt):
                  value:
                    status: CONFIRMED
                    documentType: RECEIPT
                    processingMode: FISCALIZATION
