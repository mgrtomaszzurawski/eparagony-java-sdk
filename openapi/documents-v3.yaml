      example: >-
        https://hub.eparagony.pl/view/0b2ba26e16d69974216d72ed6b666705b05259b98eec5dd953d55d03bb6dfa02
    SharedFiscalDocumentStatusProperties:
      type: object
      properties:
        fiscalDocumentId:
          type: string
          description: >-
            Fiscal document identifier. Number provided in the format
            `fiscalDeviceUniqueNumber/fiscalDocumentNumber`
          example: ZBN1901007833/568
        fiscalDeviceUniqueNumber:
          $ref: '#/components/schemas/FiscalDeviceUniqueNumber'
        fiscalDocumentNumber:
          type: number
          description: document number according to fiscal device
          example: 568
        documentUrl:
          $ref: '#/components/schemas/DocumentUrl'
        printed:
          type: boolean
          description: Indicates that paper document has been printed.
          example: true
      required:
