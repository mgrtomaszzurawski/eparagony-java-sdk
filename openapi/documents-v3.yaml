    InvoiceStatusPendingResponsePayload:
      allOf:
        - type: object
          properties:
            status:
              type: string
              const: PENDING
              description: >-
                Invoice issuance in KSeF is in progress. If the process is
                prolonged, the document will be issued in Offline mode.
          required:
            - status
        - $ref: '#/components/schemas/CommonInvoiceStatus'
        - $ref: '#/components/schemas/CommonDocumentStatus'
    KsefDocumentStatusErrorPayload:
      title: ERROR
      allOf:
        - $ref: '#/components/schemas/CommonDocumentStatusError'
        - type: object
          properties:
            errorCode:
              type: number
              description: >
                Detailed error code containing the reason for invoice
                registration failure in KSeF. Can take the following values:


                | errorCode | errorDescription |

                |-----------|------------------|

                | 440       | `"Duplikat faktury"` – Duplicate invoice |

                | 500       | `"Nieznany błąd"` – Unknown error |

                | 550       | `"Operacja została anulowana przez system"` –
                Operation was cancelled by the system |
            errorDescription:
              type: string
              description: Additional textual description of the error.
          required:
            - errorCode
            - errorDescription
    DocumentStatusReceivedResponsePayload:
      title: Other
      allOf:
        - type: object
          properties:
            status:
              type: string
              description: document received in eparagony.pl repository
              const: RECEIVED
            documentType:
              type: string
              description: Document type
              enum:
                - INVOICE
                - RECEIPT
                - GENERIC
            processingMode:
              type: string
              description: >-
                Fiscalization on fiscal device (for receipts) or issuance in
                KSeF (for invoices) has not been requested
              const: NONE
          required:
            - status
        - $ref: '#/components/schemas/CommonDocumentStatus'
        - type: object
          properties:
            documentUrl:
              $ref: '#/components/schemas/DocumentUrl'
    DocumentActionStatus:
      type: object
      properties:
        actionId:
          type: string
          description: >
            Action identifier. Can be provided by the client when creating a
            document or automatically generated as sequential numbers (`"1"`,
            `"2"`, etc.).
          example: '1'
        type:
          type: string
          enum:
            - DELIVER_VIA_ALLEGRO
          description: |
            Action type. Currently supported types:
            <ul>
              <li> DELIVER_VIA_ALLEGRO – delivery of receipt to Allegro platform </li>
            </ul>
          example: DELIVER_VIA_ALLEGRO
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
            - FAILED
          description: |
            Action status:
            <ul>
              <li> PENDING – action is waiting to be processed or is in progress </li>
              <li> COMPLETED – action completed successfully </li>
              <li> FAILED – action failed </li>
            </ul>
          example: PENDING
      required:
        - actionId
        - type
        - status
    DocumentActionsStatusResponsePayload:
      type: object
      properties:
        actions:
          type: array
          description: >-
            List of actions associated with the document along with their
            current status
          items:
            $ref: '#/components/schemas/DocumentActionStatus'
      required:
        - actions
    DocumentJWSPayload:
      type: object
      required:
        - JWS
      properties:
        JWS:
          type: string
          description: e-Document in JWS format
    DocumentJWSError-400:
      type: object
