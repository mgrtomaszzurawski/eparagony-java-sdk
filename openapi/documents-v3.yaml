          example: >-
            https://hub.eparagony.pl/view/IH4OEP5oXjq0BBCR8opAb4VsxJb20Tem0aiod52IEqJGQARkGpCzcFZ1Rnyk
        documentStatusUrl:
          type: string
          description: >-
            URL where you can get the current [document
            status](#operation/GetDocumentStatus).
          example: >-
            https://api.eparagony.pl/documents/79ab86bd-ff41-485d-832f-4b987d217da0/status
    CommonError400Schema:
      type: object
      required:
        - error
        - statusCode
