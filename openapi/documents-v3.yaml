            documentType:
              type: string
              description: Document type
              const: RECEIPT
            processingMode:
              type: string
              description: Document issuance mode
              const: FISCALIZATION
          required:
            - status
            - documentType
            - processingMode
        - $ref: '#/components/schemas/CommonDocumentStatus'
        - $ref: '#/components/schemas/SharedFiscalDocumentStatusProperties'
    FiscalDocumentStatusPendingResponsePayload:
      allOf:
        - type: object
