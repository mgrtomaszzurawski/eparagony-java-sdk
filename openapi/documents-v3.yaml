    CreateCorrectiveInvoiceDocumentPayload:
      title: Corrective invoice (PDCorrectiveInvoice)
      allOf:
        - $ref: '#/components/schemas/CreateDocumentPayload'
        - type: object
          required:
            - eCorrectiveInvoice
          properties:
            transactionToken:
              type: string
              format: UUIDv4
              example: 79ab86bd-ff41-485d-832f-4b987d217da0
              description: >
                Unique transaction identifier in UUIDv4 format. **The
                transactionToken value must be the same as for the corrected
                invoice** – generated by the client and provided when sending
                the corrected invoice, or obtained in response to the request to
                issue the corrective invoice. The exception is the situation
                when the corrected invoice was not issued via the eparagony.pl
                system – then the field may remain empty.
            statusUrl:
              type: string
              description: >
                If `eInvoicingHub: 'KSEF'` was also sent in the
                `eCorrectiveInvoice` object, notifications about the progress of
                the invoice issuance process in KSeF along with the KSeF number,
                or error information, will be sent to the provided address.
            eCorrectiveInvoice:
              $ref: '#/components/schemas/PDCorrectiveInvoice'
    GenericMetadata:
      title: GenericMetadata
      allOf:
        - $ref: '#/components/schemas/CommonMetadata'
        - type: object
          required:
            - documentType
            - documentNumber
            - grossSaleValue
          properties:
            documentType:
              type: string
              description: >-
                Declared document type. E.g. "WZ", "RW", "WF" etc. According to
                definitions in downstream systems of the integrating party
            grossSaleValue:
              type: integer
              format: int32
              description: Total gross sales value – integer **in pennies (grosze)**
              example: 6148
            orderId:
              type: string
              description: >-
                Order ID (if the document can be linked to a customer order).
                Uniqueness is not required on the eparagony.pl side.
            taxRates:
              $ref: '#/components/schemas/TaxRates'
            consumerName:
              type: string
              description: First and last name or company name
              example: Platforma Detalistów sp z o.o.
            consumerAddress:
              $ref: '#/components/schemas/EntityAddress'
            documentNumber:
              type: string
              description: Document number.
              example: 2022/07/122
            additionalDescription:
              type: array
              description: >-
                Advertising and informational content defined by the seller. May
                contain information not covered earlier - system numbers, codes
                and identifiers of transactions and orders in reference to which
                the transaction is carried out, which may be included in the
                document, information about the serving employee. Each line
                contains a separate object - graphical or textual.
              items:
                $ref: '#/components/schemas/AdditionalDescriptionLine'
    PDGeneric:
      title: PDGeneric
      description: >-
        an object containing the data of any non-fiscal document necessary to
        create a digital confirmation of a transaction (not to be confused with
        a fiscal receipt in electronic form) or to transfer the document to the
        financial and accounting system. Note: this parameter can be passed
        provided that the same request does not include parameters `eInvoice`,
        `eCorrectiveInvoice`, `eTicketReceipt` or `eReceipt`
      required:
        - metadata
        - lines
        - payment
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/GenericMetadata'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptLine'
          description: >-
            Line items, provided in order corresponding with a printed receipt.
            Please notice that there are different types of lines (product and
            rebate) in the dropdown list below.
        extensions:
          $ref: '#/components/schemas/EInvoiceExtension'
        payment:
          $ref: '#/components/schemas/Payment'
    CreateGenericDocumentPayload:
      title: Other (PDGeneric)
      allOf:
        - $ref: '#/components/schemas/CreateDocumentPayload'
        - type: object
          required:
            - eGeneric
          properties:
            transactionToken:
              type: string
              format: UUIDv4
              example: 79ab86bd-ff41-485d-832f-4b987d217da0
              description: >
                Unique transaction identifier in UUIDv4 format. It's required
                when `documentToken` is also provided. If identifiers are not
                provided, they will be generated and returned in the response.
                Providing the identifier is necessary to issue more than one
                document for a transaction.
            eGeneric:
              $ref: '#/components/schemas/PDGeneric'
    TransactionTokenParam:
      type: string
      format: UUIDv4
      description: The `token` received as a result of the transaction registration
      example: 79ab86bd-ff41-485d-832f-4b987d217da0
    DocumentTokenParam:
