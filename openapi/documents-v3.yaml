          description: The amount for `B` tax rate code
        C:
          type: string
          example: '50.99'
          description: The amount for `C` tax rate code
        D:
          type: string
          example: '1'
          description: The amount for `D` tax rate code
        E:
          type: string
          example: '10'
          description: The amount for `E` tax rate code
        F:
          type: string
          example: '100.20'
          description: The amount for `F` tax rate code
        G:
          type: string
          example: '200'
          description: The amount for `G` tax rate code
    FiscalDocumentStatusReadyWebhookRequestBody:
      title: READY
      allOf:
        - type: object
          properties:
            status:
              type: string
              description: >
                commands successfully processed by the printer. The webhook
                notification with status `READY` is intended to inform that the
                paper receipt was printed correctly. Thus:
                  1. at the time of delivery of this status, the e-document may not yet have been delivered to the repository.
                  2. the `READY` status webhook notification is only sent if a paper printout was ordered (`printStatus: true` was sent with the document data)
              const: READY
          required:
            - status
        - $ref: '#/components/schemas/CommonFiscalDocumentStatusReady'
    DocumentActionStatusWebhookRequestBody:
      title: Document action status (webhook)
      type: object
      properties:
        documentToken:
          type: string
          format: uuid
          description: Document token
          example: cc87c194-ca98-4eba-a494-bbf166830ada
        transactionToken:
          type: string
          format: uuid
          description: Transaction token
          example: cc87c194-ca98-4eba-a494-bbf166830ada
        actionId:
          type: string
          description: Action identifier
          example: '1'
        type:
          type: string
          enum:
            - DELIVER_VIA_ALLEGRO
          description: Action type
          example: DELIVER_VIA_ALLEGRO
        status:
          type: string
          enum:
            - COMPLETED
            - FAILED
          description: |
            Action status:
            <ul>
              <li> COMPLETED – action completed successfully </li>
              <li> FAILED – action failed </li>
            </ul>
          example: COMPLETED
      required:
        - documentToken
        - transactionToken
        - actionId
        - type
        - status
  requestBodies:
    AuthToken: *ref_7
    createDocument:
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CreateReceiptDocumentPayload'
              - $ref: '#/components/schemas/CreateTicketReceiptDocumentPayload'
              - $ref: '#/components/schemas/CreateVatInvoiceDocumentPayload'
              - $ref: >-
                  #/components/schemas/CreateAdvancePaymentInvoiceDocumentPayload
              - $ref: '#/components/schemas/CreateSettlementInvoiceDocumentPayload'
              - $ref: '#/components/schemas/CreateCorrectiveInvoiceDocumentPayload'
              - $ref: '#/components/schemas/CreateGenericDocumentPayload'
          examples:
            Paragon - wymagane dane:
              value:
                posId: pos-10
                eReceipt:
                  fiscalize: true
                  metadata:
                    grossSaleValue: 9802
                    taxRates:
                      A: '23'
                      B: '8'
                      C: '5'
                      D: '0'
                      E: ZW
                      F: '0'
                      G: '0'
                  lines:
                    - type: PRODUCT
                      productOrServiceName: Long-sleeve red t-shirt 123
                      quantity: '2'
                      unitPrice: 4901
                      totalLineValue: 9802
                      taxRate: A
                  payment:
                    payments:
                      - paymentForm: Mobilna
                        paidThisForm: 10000
                    totalPaid: 10000
            Paragon - wszystkie dane:
              value:
                posId: pos-10
                statusUrl: https://example.com/webhook
                documentToken: 1b60f0a6-ddf9-4898-bc73-279c10d57b10
                transactionToken: 3e255092-e47c-4f8f-a120-765efee8f15d
                eReceipt:
                  print: false
                  fiscalize: true
                  metadata:
                    cashRegisterId: '12'
                    cashierId: KASJER01
                    shiftId: '3'
                    orderId: AB234
                    grossSaleValue: 9802
                    currency: PLN
                    taxRates:
                      A: '23'
                      B: '8'
                      C: '5'
                      D: '0'
                      E: ZW
                      F: '0'
                      G: '0'
                    additionalDescription:
                      - type: TEXT
                        body: text line
                    consumerTIN: '5213796333'
                    orderTime: '2019-09-02T09:16:42Z'
                    merchantDocumentId: '123456789'
                  lines:
                    - type: PRODUCT
