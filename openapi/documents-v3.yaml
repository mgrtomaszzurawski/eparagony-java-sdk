                        type: object
                        properties:
                          paymentTime:
                            type: string
                            description: >-
                              Date and time of payment in ISO-8601 format in UTC
                              time (ending with `Z`, e.g.
                              `"2019-09-02T09:16:42Z"`) or with offset relative
                              to UTC (e.g. `"2019-09-02T11:16:42+02:00"`)
                            example: '2019-09-02T09:16:42Z'
                          paidAmount:
                            type: integer
                            format: uint32
                            description: Payment amount
                            example: 22332
                          exchangeRate:
                            type: string
                            description: >-
                              Currency exchange rate to PLN for invoice issued
                              in foreign currency.
                            example: '4.313'
                        required:
                          - paymentTime
                          - paidAmount
            additionalParties:
              type: array
              items:
                $ref: '#/components/schemas/AdditionalParty'
