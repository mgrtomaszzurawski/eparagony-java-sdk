        statusCode:
          type: number
          default: 422
        message:
          type: string
          default: Unprocessable Entity
    schemas_pl_DocumentTokenParam:
      type: string
      format: UUIDv4
      description: >-
        Unikalny identyfikator dokumentu w formacie UUIDv4 otrzymany w
        odpowiedzi na żądanie wystawienia dokumentu
      example: 79ab86bd-ff41-485d-832f-4b987d217da0
    CommonDocumentStatus:
      type: object
