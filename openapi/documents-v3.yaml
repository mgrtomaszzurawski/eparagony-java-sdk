    CommonDocumentStatusError:
      allOf:
        - type: object
          properties:
            status:
              type: string
              description: document issuance ended by error
              default: ERROR
            documentType:
              type: string
              description: Document type
              enum:
                - INVOICE
                - RECEIPT
            processingMode:
              type: string
              description: Document issuance mode
              enum:
                - KSEF
                - FISCALIZATION
          required:
            - status
            - documentType
            - processingMode
        - $ref: '#/components/schemas/CommonDocumentStatus'
    FiscalDocumentStatusErrorPayload:
      title: ERROR
      allOf:
        - $ref: '#/components/schemas/CommonDocumentStatusError'
        - type: object
          properties:
            errorCode:
              type: number
              description: >
                Detailed error code containing the reason for fiscalization
                process failure. Can take the following values:

                <ul>
                  <li> 83 – fiscal printer protocol error </li>
                </ul>

                Fiscal printer protocol error can occur when (list not
                exhaustive):

                  1. Printer is not fiscalized
                  2. Product name is incorrect (see term "schodek podatkowy")
                  3. E-receipts have not been activated on the device

                All the above mentioned situations require handling on the
                merchant side (software/infrastructure). When the root cause is
                eliminated, the transaction has to be registered again.
                eparagony.pl can provide support in identifying the root cause.
            errorDescription:
              type: string
              description: >
                Additional textual description of the error. Examples of
                responses:


                For Novitus printer:

                <ul>
                  <li> Kod błędu drukarki: 16 - błędna nazwa towaru, prawdopodobnie brak znaków w kodowaniu Windows-1250, rozważ transliterację </li>
                  <li> Kod błędu drukarki: 18 - wystąpił schodek podatkowy, sprawdź poprawność stawki VAT i/lub zmień nazwę towaru </li>
                </ul>


                For Posnet printer:

                <ul>
                  <li> Kod błędu drukarki: 2106 - wystąpił schodek podatkowy, sprawdź poprawność stawki VAT i/lub zmień nazwę towaru</li>
                </ul>


                In case the root cause cannot be identified, the following error
                message containing printer error will be returned: 

                <ul>
                  <li> Kod błędu drukarki: 99 </li>
                </ul>
          required:
            - errorCode
            - errorDescription
    CommonInvoiceStatus:
      type: object
      properties:
        documentType:
          type: string
          description: Document type
          const: INVOICE
        processingMode:
          type: string
          description: Document issuance mode
          enum:
            - KSEF
            - NONE
        invoiceNumber:
          type: string
          description: invoice number
          example: FV2022/12/545
        documentUrl:
          $ref: '#/components/schemas/DocumentUrl'
      required:
        - invoiceNumber
        - documentType
        - processingMode
    CommonInvoiceStatusConfirmed:
      allOf:
        - type: object
          properties:
            status:
              type: string
              const: CONFIRMED
              description: invoice successfully issued
          required:
            - status
        - $ref: '#/components/schemas/CommonInvoiceStatus'
        - $ref: '#/components/schemas/CommonDocumentStatus'
        - type: object
          properties:
            ksefInvoice:
              description: KSeF invoice issuance details
              type: object
              properties:
                ksefNumber:
                  description: KSeF invoice number
                  type: string
                  example: 5265877635-20250626-010080DD2B5E-26
                referenceNumber:
                  description: Invoice reference number
                  type: string
                  example: 20250626-EE-2F15D39000-242207E5C4-1B
                sessionReferenceNumber:
                  description: >-
                    Session reference number within which the invoice was
                    submitted
                  type: string
                  example: 20250625-SO-2C3E6C8000-B675CF5D68-07
                invoiceHash:
                  description: >-
                    SHA-256 hash in Base64URL format of the invoice XML file
                    submitted to KSeF
                  type: string
                  example: UtQp9Gpc51y-u3xApZjIjgkpZ01js-J8KflSPW8WzIE
                issueDate:
                  type: string
                  description: Invoice issuance date in YYYY-MM-DD format
                  example: '2025-01-01'
                invoicingDate:
                  type: string
                  description: >-
                    Invoice submission date and time to KSeF in ISO-8601 UTC
                    format
                  example: '2025-01-01T12:32:12.501Z'
                acquisitionDate:
                  type: string
                  description: >-
                    Invoice acceptance date and time in KSeF in ISO-8601 UTC
                    format
                  example: '2025-01-01T12:53:10.532Z'
                invoiceUrl:
                  type: string
                  example: >-
                    https://ksef.mf.gov.pl/client-app/invoice/1111111111/01-02-2026/UtQp9Gpc51y-u3xApZjIjgkpZ01js-J8KflSPW8WzIE
              required:
                - ksefNumber
                - referenceNumber
                - sessionReferenceNumber
                - invoiceHash
                - issueDate
                - invoicingDate
                - acquisitionDate
                - invoiceUrl
    CommonInvoiceStatusOffline:
